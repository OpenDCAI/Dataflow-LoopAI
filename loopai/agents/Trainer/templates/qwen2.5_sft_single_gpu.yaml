### model
model_name_or_path: /home/lpc/models/Qwen2.5-0.5B-Instruct/
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full

### dataset
dataset: alpaca_en_demo
template: qwen
cutoff_len: 1024
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: ./outputs
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none
use_swanlab: true
swanlab_mode: local

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 5.0e-05
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true

### eval
val_size: 0.1
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100
