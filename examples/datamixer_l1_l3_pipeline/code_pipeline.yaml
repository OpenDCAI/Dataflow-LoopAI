pipeline:
  name: webpage_code_l1_to_executable_sft_l3
  source:
    dataset: webpage_code_l1
    filter: quality_level = 'L1'
  operators:
    - name: webpage_to_pt
      args:
        engine: mineru
        min_chars: 300
        max_chars: 120000
        mineru_transport: http
        mineru_url: http://127.0.0.1:7986
        mineru_batch_size: 1
        mineru_timeout: 900
        fallback: legacy

    # Local projection only: no quality decision is made here.
    - name: code_record_prepare
      args:
        extract_code_blocks: true
        max_code_blocks: 24

    - name: dataflow
      args:
        op: CodeAutoGeneratedFilter
        input_key: code_sample
        output_key: native_code_autogenerated_pass
        kind: filter

    - name: dataflow
      args:
        op: CodeLengthSampleFilter
        input_key: code_sample
        output_key: native_code_length_pass
        kind: filter

    - name: dataflow
      args:
        op: CodeTextCompositionFilter
        input_key: code_sample
        output_key: native_code_text_composition_pass
        kind: filter

    - name: dataflow
      args:
        op: CodeEncodedDataFilter
        input_key: code_sample
        output_key: native_code_encoded_data_pass
        kind: filter

    - name: dataflow
      args:
        op: CodeDocumentQualityFilter
        input_key: code_sample
        output_key: native_code_document_quality_pass
        kind: filter
        thresholds:
          min_num_chars: 100
          max_num_chars: 120000
          min_num_words: 10
          max_num_words: 60000
          max_frac_duplicate_lines: 0.5
          max_frac_duplicate_2gram: 0.5
          max_frac_duplicate_3gram: 0.5
          max_frac_duplicate_4gram: 0.5
          max_frac_duplicate_5gram: 0.5
          max_frac_curly_bracket: 0.2
          max_frac_all_caps_words: 0.5
          min_entropy_unigram: 1.0

    - name: dataflow
      args:
        op: CodeFileTypeContentFilter
        input_key: code_sample
        output_key: native_code_file_type_pass
        kind: filter

    - name: domain_classify
      args:
        model: qwen3-14b-fp8
        labels: [code]
        chunk_size: 1
        max_concurrency: 4
        max_input_chars: 12000
        max_tokens: 2048

    - name: domain_quality_filter
      args:
        target_domain: code
        min_classifier_confidence: 0.8
        min_chars: 300
        require_primary_label: false
        max_target_label_rank: 3
      output:
        dataset: webpage_code_l2_pt
        quality_level: L2
        stage: pretrain
        modality: code
        processing_level: native_dataflow_code_filtered
        description: Code PT admitted by Qwen and native OpenDCAI Code filters.

    - name: pt_to_sft_code
      args:
        model: qwen3-14b-fp8
        chunk_size: 1
        max_concurrency: 4
        max_input_chars: 12000
        max_tokens: 4096
        max_retries: 2

    - name: code_sft_validate
      output:
        dataset: webpage_code_l3_sft
        quality_level: L3
        stage: sft
        modality: code
        task_type: grounded_code_qa
        processing_level: executable_grounded_sft
        description: Source-grounded Code SFT validated for syntax when supported.
