model_provider = "dashscope_http"

[model_providers.dashscope_http]
name = "DashScope HTTP"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
env_key = "DASHSCOPE_API_KEY"
wire_api = "responses"
supports_websockets = false

[projects.".."]
trust_level = "trusted"

[mcp_servers.loopai_mcp]
command = "python3"
args = ["-m", "loopai.mcp.server"]
cwd = "."
startup_timeout_sec = 20
tool_timeout_sec = 600
enabled = true
required = false
default_tools_approval_mode = "prompt"
enabled_tools = [
  "configer_get_schema",
  "configer_get",
  "configer_get_task",
  "configer_update",
  "configer_update_task",
  "judger_run",
  "judger_load_events",
  "trainer_run",
  "trainer_load_events",
]

[mcp_servers.loopai_mcp.env]
PYTHONPATH = "./"
DB_PATH = "./api/db/db.sqlite3"
