model_provider = "dashscope_http"

[model_providers.dashscope_http]
name = "DashScope HTTP"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
env_key = "DASHSCOPE_API_KEY"
wire_api = "responses"
supports_websockets = false

[projects.".."]
trust_level = "trusted"

[mcp_servers.loopai_configer]
command = "python3"
args = ["-m", "loopai.mcp.server"]
cwd = ".."
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled = true
required = false
default_tools_approval_mode = "prompt"
enabled_tools = [
  "configer_get_schema",
  "configer_get",
  "configer_get_task",
  "configer_update",
  "configer_update_task",
]

[mcp_servers.loopai_configer.env]
PYTHONPATH = "./"
DB_PATH = "./api/db/db.sqlite3"

[[hooks.PreToolUse]]
matcher = "^mcp__loopai_[a-z0-9_]+__.*$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "bash -lc 'cd \"$CODEX_WORKSPACE\" && python3 -m loopai.mcp.hooks.update_task_runtime pre'"
timeout = 30
statusMessage = "Updating LoopAI runtime status to running"

[[hooks.PostToolUse]]
matcher = "^mcp__loopai_[a-z0-9_]+__.*$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "bash -lc 'cd \"$CODEX_WORKSPACE\" && python3 -m loopai.mcp.hooks.update_task_runtime post'"
timeout = 30
statusMessage = "Updating LoopAI runtime status after tool execution"
